<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resume Copilot Options</title>
    <link rel="stylesheet" href="../shared/ui.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <a class="skip-link" href="#settings">跳到设置</a>
    <main class="page">
      <header class="page-header">
        <div>
          <h1>Resume Copilot</h1>
          <p>配置 Doubao，并维护用于 BOSS 简历分析的岗位知识库。</p>
        </div>
        <div class="header-actions">
          <span class="badge">BOSS MVP</span>
          <button id="closeOptionsButton" class="button-secondary" type="button">关闭</button>
        </div>
      </header>

      <section id="settings" class="section">
        <div class="section-title">
          <h2>API 设置</h2>
          <p>API Key 保存在本机插件存储中，适合个人原型。</p>
        </div>
        <div class="field-grid">
          <label>
            <span>Doubao API Key</span>
            <input
              id="apiKeyInput"
              name="doubao-api-key"
              type="password"
              autocomplete="off"
              spellcheck="false"
              placeholder="sk-…"
            />
          </label>
          <label>
            <span>模型</span>
            <input
              id="modelInput"
              name="doubao-model"
              type="text"
              autocomplete="off"
              spellcheck="false"
              value="doubao-seed-2-0-mini-260428"
            />
          </label>
        </div>
        <div class="actions">
          <button id="saveSettingsButton" type="button">保存 API 设置</button>
          <span id="settingsStatus" class="status" role="status" aria-live="polite"></span>
        </div>
      </section>

      <section class="section two-column">
        <div class="composer">
          <div class="section-title">
            <h2>生成岗位 JSON</h2>
            <p>粘贴 JD 后让 Doubao 结构化，生成后可继续手动编辑。</p>
          </div>
          <label>
            <span>JD 文本</span>
            <textarea
              id="jdInput"
              name="job-description"
              rows="11"
              autocomplete="off"
              placeholder="粘贴岗位 JD…"
            ></textarea>
          </label>
          <label>
            <span>内部定制需求</span>
            <textarea
              id="internalRequirementsInput"
              name="internal-requirements"
              rows="6"
              autocomplete="off"
              placeholder="填写比 JD 优先级更高的筛选要求，例如年龄、学历、行业、项目背景或必须排除的情况…"
            ></textarea>
          </label>
          <div class="actions">
            <button id="generateProfileButton" type="button">生成岗位 JSON</button>
            <button id="clearEditorButton" class="button-secondary" type="button">清空编辑区</button>
            <span id="generateStatus" class="status" role="status" aria-live="polite"></span>
          </div>
        </div>

        <div class="editor">
          <div class="section-title">
            <h2>岗位知识库</h2>
            <p>JSON 校验通过后保存到本地。</p>
          </div>
          <label>
            <span>已保存岗位</span>
            <select id="profileSelect" name="saved-job-profile"></select>
          </label>
          <label>
            <span>岗位大类</span>
            <select id="categorySelect" name="job-profile-category"></select>
          </label>
          <label>
            <span>岗位 JSON</span>
            <textarea
              id="jsonEditor"
              class="json-editor"
              name="job-profile-json"
              rows="18"
              autocomplete="off"
              spellcheck="false"
            ></textarea>
          </label>
          <div class="actions">
            <button id="saveProfileButton" type="button">保存岗位</button>
            <button id="formatProfileButton" class="button-secondary" type="button">格式化</button>
            <button id="deleteProfileButton" class="button-danger" type="button">删除</button>
            <span id="profileStatus" class="status" role="status" aria-live="polite"></span>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="options.js"></script>
  </body>
</html>
