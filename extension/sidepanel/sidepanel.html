<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resume Copilot</title>
    <link rel="stylesheet" href="../shared/ui.css" />
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <main class="sidepanel-app">
      <aside class="settings-sidebar" aria-labelledby="settingsTitle">
        <header class="settings-header">
          <h2 id="settingsTitle">评估设置</h2>
          <p>岗位、来源和提交方式</p>
        </header>

        <div class="settings-scroll">
          <section class="settings-block">
            <label>
              <span>岗位大类</span>
              <select id="categorySelect" name="selected-job-category"></select>
            </label>

            <label>
              <span>指定评估岗位</span>
              <select id="profileSelect" name="selected-job-profile"></select>
            </label>
          </section>

          <section class="settings-block source-group">
            <div class="source-title">
              <h3>当前网页简历</h3>
              <p>支持 BOSS 和 Moka。打开候选人详情后可自动提交，也可手动提交当前页面。</p>
            </div>
            <button id="autoMatchBossButton" type="button">自动判断岗位</button>
            <button id="analyzeBossButton" class="button-secondary" type="button">
              按指定岗位评估
            </button>
          </section>

          <section class="settings-block source-group">
            <div class="source-title">
              <h3>PDF 简历文件</h3>
              <p>上传附件简历后提交后台解析，扫描件会渲染为图片交给 Doubao OCR。</p>
            </div>
            <label class="file-picker">
              <span>选择 PDF 文件</span>
              <input id="pdfInput" name="resume-pdf" type="file" accept="application/pdf,.pdf" />
            </label>
            <button id="autoMatchPdfButton" type="button">解析并自动判断岗位</button>
            <button id="analyzePdfButton" class="button-secondary" type="button">
              按指定岗位评估
            </button>
          </section>

          <section class="settings-block source-group">
            <button id="reanalyzeLastButton" class="button-secondary reanalyze-button" type="button" disabled>
              复用上次简历再评估
            </button>
            <p id="statusText" class="status" role="status" aria-live="polite"></p>
          </section>
        </div>
      </aside>

      <section class="app-main panel">
        <header class="panel-header">
          <div class="brand-block">
            <div class="brand-mark" aria-hidden="true">RC</div>
            <div>
              <h1>Resume Copilot</h1>
              <p>候选人后台解析队列</p>
            </div>
          </div>
          <div class="header-actions">
            <button id="refreshButton" class="button-secondary button-compact" type="button">刷新</button>
            <button id="historyButton" class="button-secondary button-compact" type="button">历史页</button>
            <button
              id="openOptionsButton"
              class="button-secondary button-compact"
              type="button"
              title="打开设置"
              aria-label="打开设置"
            >
              设置
            </button>
          </div>
        </header>

        <div class="workspace">
          <aside class="candidate-sidebar" aria-labelledby="candidateListTitle">
            <div class="sidebar-title">
              <div>
                <h2 id="candidateListTitle">候选人历史</h2>
                <p id="historySummary">打开候选人简历后会自动进入这里</p>
              </div>
              <span id="candidateCount" class="count-badge">0</span>
            </div>
            <div id="historyList" class="history-list"></div>
          </aside>

          <section class="analysis-pane">
            <section id="captureBlock" class="capture-block" hidden>
              <h2>最近提交</h2>
              <p id="captureSummary"></p>
            </section>

            <section class="task-block" aria-labelledby="taskTitle">
              <h2 id="taskTitle">后台任务</h2>
              <div id="taskList" class="task-list"></div>
            </section>

            <section id="reportRoot" class="report" hidden></section>
          </section>
        </div>
      </section>
    </main>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
