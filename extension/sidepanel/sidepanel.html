<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resume Copilot</title>
    <link rel="stylesheet" href="../shared/ui.css" />
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <main class="panel">
      <header class="panel-header">
        <div>
          <h1>Resume Copilot</h1>
          <p>候选人后台解析队列</p>
        </div>
        <div class="header-actions">
          <button id="refreshButton" class="button-secondary button-compact" type="button">刷新</button>
          <button id="historyButton" class="button-secondary button-compact" type="button">历史</button>
          <button
            id="openOptionsButton"
            class="button-secondary button-compact"
            type="button"
            title="打开设置"
            aria-label="打开设置"
          >
            设置
          </button>
        </div>
      </header>

      <section class="control-block">
        <label>
          <span>岗位大类</span>
          <select id="categorySelect" name="selected-job-category"></select>
        </label>

        <label>
          <span>指定评估岗位</span>
          <select id="profileSelect" name="selected-job-profile"></select>
        </label>

        <div class="source-group">
          <div class="source-title">
            <h2>当前网页简历</h2>
            <p>支持 BOSS 和 Moka。先打开候选人详情，再提交当前页面。</p>
          </div>
          <button id="autoMatchBossButton" type="button">自动判断适合哪个岗位</button>
          <button id="analyzeBossButton" class="button-secondary" type="button">
            按上方指定岗位评估
          </button>
        </div>

        <div class="divider"><span>或</span></div>

        <div class="source-group">
          <div class="source-title">
            <h2>PDF 简历文件</h2>
            <p>上传附件简历后提交到后台解析，扫描件会渲染为图片交给 Doubao OCR。</p>
          </div>
          <label>
            <span>选择 PDF</span>
            <input id="pdfInput" name="resume-pdf" type="file" accept="application/pdf,.pdf" />
          </label>
          <button id="autoMatchPdfButton" type="button">自动判断适合哪个岗位</button>
          <button id="analyzePdfButton" class="button-secondary" type="button">
            按上方指定岗位评估
          </button>
        </div>

        <button id="reanalyzeLastButton" class="button-secondary" type="button" disabled>
          复用上次简历，按指定岗位再评估
        </button>

        <p id="statusText" class="status" role="status" aria-live="polite"></p>
      </section>

      <section id="captureBlock" class="capture-block" hidden>
        <h2>最近提交</h2>
        <p id="captureSummary"></p>
      </section>

      <section class="task-block" aria-labelledby="taskTitle">
        <h2 id="taskTitle">后台任务</h2>
        <div id="taskList" class="task-list"></div>
      </section>

      <section id="reportRoot" class="report" hidden></section>
    </main>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
